apiVersion: v1
kind: Namespace
metadata:
  name: agentic-ai
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: nvidia-device-plugin
  template:
    metadata:
      labels:
        app: nvidia-device-plugin
    spec:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: plugin
        image: nvcr.io/nvidia/k8s-device-plugin:v0.17.1
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: DEVICE_LIST_STRATEGY
          value: envvar
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        volumeMounts:
        - name: devices
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: devices
        hostPath:
          path: /var/lib/kubelet/device-plugins
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-collector
  namespace: agentic-ai
spec:
  selector:
    matchLabels:
      app: otel-node-collector
  template:
    metadata:
      labels:
        app: otel-node-collector
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.120.0
        args: ["--config=/etc/otelcol-contrib/config.yaml"]
        env:
        - name: OTEL_SERVICE_NAME
          value: kubernetes-node-telemetry
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol-contrib
        - name: hostfs
          mountPath: /hostfs
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: otel-collector-node-config
      - name: hostfs
        hostPath:
          path: /
          type: Directory
