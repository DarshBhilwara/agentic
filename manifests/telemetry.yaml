apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      containers:
      - name: phoenix
        image: arizeai/phoenix:latest
        ports:
        - containerPort: 6006 
        - containerPort: 4317 
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-svc
  namespace: agentic-ai
spec:
  type: NodePort
  selector:
    app: phoenix
  ports:
  - name: http
    port: 6006
    targetPort: 6006
    nodePort: 30006
