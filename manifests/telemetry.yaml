apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      containers:
      - name: phoenix
        image: arizephoenix/phoenix:latest
        ports:
        - containerPort: 6006 
        - containerPort: 4317 
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-svc
  namespace: agentic-ai
spec:
  type: NodePort
  selector:
    app: phoenix
  ports:
  - name: http
    port: 6006
    targetPort: 6006
    nodePort: 30006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--web.enable-otlp-receiver"  # Crucial flag to accept OpenTelemetry metrics
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: agentic-ai
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    nodePort: 30090