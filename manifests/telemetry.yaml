apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-config
  namespace: agentic-ai
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
          - job_name: vllm
            scrape_interval: 15s
            static_configs:
            - targets: [vllm-service:8000]

    processors:
      batch: {}
      resource:
        attributes:
        - key: telemetry.collection.endpoint
          value: otel-collector
          action: upsert

    exporters:
      otlp/phoenix:
        endpoint: phoenix-svc:4317
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://prometheus-svc:9090/api/v1/write
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [otlp/phoenix]
        metrics:
          receivers: [otlp, prometheus]
          processors: [resource, batch]
          exporters: [prometheusremotewrite]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-node-config
  namespace: agentic-ai
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      hostmetrics:
        root_path: /hostfs
        collection_interval: 10s
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          network: {}
          disk: {}
          filesystem: {}
          process: {}
          processes: {}

    processors:
      batch: {}
      resourcedetection:
        detectors: [system]
        system:
          hostname_sources: [os]
      resource:
        attributes:
        - key: telemetry.collection.endpoint
          value: otel-collector
          action: upsert
        - key: service.name
          value: kubernetes-node-telemetry
          action: upsert
        - key: k8s.node.name
          value: ${env:K8S_NODE_NAME}
          action: upsert

    exporters:
      otlp:
        endpoint: otel-collector:4317
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [hostmetrics, otlp]
          processors: [resourcedetection, resource, batch]
          exporters: [otlp]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: agentic-ai
spec:
  selector:
    app: otel-collector-gateway
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-gateway
  namespace: agentic-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector-gateway
  template:
    metadata:
      labels:
        app: otel-collector-gateway
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.120.0
        args: ["--config=/etc/otelcol-contrib/config.yaml"]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        volumeMounts:
        - {name: config, mountPath: /etc/otelcol-contrib}
      volumes:
      - name: config
        configMap:
          name: otel-collector-gateway-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels: {app: phoenix}
  template:
    metadata:
      labels: {app: phoenix}
    spec:
      containers:
      - name: phoenix
        image: arizephoenix/phoenix:latest
        ports:
        - {name: http, containerPort: 6006}
        - {name: otlp-grpc, containerPort: 4317}
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix-svc
  namespace: agentic-ai
spec:
  type: NodePort
  selector: {app: phoenix}
  ports:
  - {name: http, port: 6006, targetPort: 6006, nodePort: 30006}
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: agentic-ai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: agentic-ai
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --web.enable-remote-write-receiver
        volumeMounts:
        - {name: prometheus-config, mountPath: /etc/prometheus}
        ports: [{name: http, containerPort: 9090}]
      volumes:
      - name: prometheus-config
        configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: agentic-ai
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090, nodePort: 30090}]
