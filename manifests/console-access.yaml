apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-console
  namespace: agentic-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-console-node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-console-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentic-console-node-reader
subjects:
- kind: ServiceAccount
  name: agentic-console
  namespace: agentic-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-console-pod-reader
  namespace: agentic-ai
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-console-pod-reader
  namespace: agentic-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-console-pod-reader
subjects:
- kind: ServiceAccount
  name: agentic-console
  namespace: agentic-ai
