apiVersion: v1
kind: PersistentVolume
metadata: {name: agentic-workspace-pv}
spec:
  capacity: {storage: 100Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: agentic-local
  nfs:
    server: agent-01
    path: /home/iiitd/Documents/agentic/workspace
  nodeAffinity:
    required:
      nodeSelectorTerms: [{matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [agent-01]}]}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: agentic-workspace, namespace: agentic-ai}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: agentic-local
  resources: {requests: {storage: 100Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: agentic-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      containers: [{name: redis, image: redis:7-alpine, ports: [{containerPort: 6379}]}]
---
apiVersion: v1
kind: Service
metadata: {name: redis-service, namespace: agentic-ai}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-worker, namespace: agentic-ai}
spec:
  replicas: 2
  selector: {matchLabels: {app: agent-worker}}
  template:
    metadata: {labels: {app: agent-worker}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector: {matchLabels: {app: agent-worker}}
      initContainers: [{name: init-workspace, image: busybox, command: [sh, -c, mkdir -p /workspace/users /workspace/incoming /workspace/processed && chmod -R 777 /workspace], volumeMounts: [{name: workspace, mountPath: /workspace}]}]
      containers:
      - name: worker
        image: python:3.11-slim
        workingDir: /app
        command: [sh, -c, pip install --no-cache-dir redis requests openai opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http && python worker.py]
        env:
        - {name: AGENT_MODEL_NAME, value: qwen}
        - {name: AGENT_VLLM_URL, value: "http://vllm-service:8000/v1"}
        - {name: OTEL_SERVICE_NAME, value: agent-worker}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        - {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://otel-collector:4318/v1/metrics"}
        volumeMounts: [{name: code, mountPath: /app}, {name: workspace, mountPath: /workspace}]
      volumes: [{name: code, hostPath: {path: /home/iiitd/Documents/agentic/code}}, {name: workspace, persistentVolumeClaim: {claimName: agentic-workspace}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: agentic-ai}
spec:
  replicas: 6
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector: {matchLabels: {app: api-gateway}}
      containers:
      - name: gateway
        image: python:3.11-slim
        workingDir: /app
        command: [sh, -c, pip install --no-cache-dir fastapi uvicorn redis opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http && uvicorn gateway:app --host 0.0.0.0 --port 8000]
        env:
        - name: AGENT_API_KEYS
          valueFrom:
            secretKeyRef:
              name: agent-api-keys
              key: json
              optional: true
        - {name: OTEL_SERVICE_NAME, value: agent-gateway}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        - {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://otel-collector:4318/v1/metrics"}
        ports: [{containerPort: 8000}]
        volumeMounts: [{name: code, mountPath: /app}]
      volumes: [{name: code, hostPath: {path: /home/iiitd/Documents/agentic/code}}]
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: agentic-ai}
spec:
  type: NodePort
  selector: {app: api-gateway}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
