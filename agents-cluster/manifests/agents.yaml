apiVersion: v1
kind: Namespace
metadata:
  name: agentic-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-inference
  namespace: agentic-ai
data:
  AGENT_VLLM_URL: __VLLM_URL__
  AGENT_MODEL_NAME: qwen
  AGENT_INFERENCE_REPLICA_ID: external
  OTEL_PHOENIX_ENDPOINT: __OTEL_PHOENIX_ENDPOINT__
  OTEL_PROMETHEUS_ENDPOINT: __OTEL_PROMETHEUS_ENDPOINT__
  OTEL_LOGS_ENDPOINT: http://loki-svc:3100/loki/api/v1/push
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agentic-workspace-pv
spec:
  capacity: {storage: 100Gi}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: agentic-local
  hostPath: {path: __AGENT_BASE_DIR__/workspace, type: DirectoryOrCreate}
  nodeAffinity:
    required:
      nodeSelectorTerms: [{matchExpressions: [{key: agentic.io/role, operator: In, values: [agent]}]}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: agentic-workspace, namespace: agentic-ai}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: agentic-local
  resources: {requests: {storage: 100Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: agentic-redis, namespace: agentic-ai}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: agentic-ai}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      containers:
      - name: redis
        image: redis:7-alpine
        args: [redis-server, --appendonly, "yes", --appendfsync, everysec]
        ports: [{containerPort: 6379}]
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: agentic-redis}}]
---
apiVersion: v1
kind: Service
metadata: {name: redis-service, namespace: agentic-ai}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-worker, namespace: agentic-ai}
spec:
  replicas: 2
  selector: {matchLabels: {app: agent-worker}}
  template:
    metadata: {labels: {app: agent-worker}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      terminationGracePeriodSeconds: 60
      initContainers: [{name: init-workspace, image: busybox, command: [sh, -c, mkdir -p /workspace/users /workspace/incoming /workspace/processed], volumeMounts: [{name: workspace, mountPath: /workspace}]}]
      containers:
      - name: worker
        image: agentic-worker:0.1
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: [python, worker.py]
        env:
        - {name: OTEL_SERVICE_NAME, value: agent-worker}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        - {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://otel-collector:4318/v1/metrics"}
        - {name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: "http://otel-collector:4318/v1/logs"}
        - {name: AGENT_TELEMETRY_CONTENT_CAPTURE, value: full}
        - name: AGENT_VLLM_URL
          valueFrom: {configMapKeyRef: {name: agent-inference, key: AGENT_VLLM_URL}}
        - {name: AGENT_VLLM_URL_FILE, value: /etc/agentic-inference/url}
        - name: AGENT_MODEL_NAME
          valueFrom: {configMapKeyRef: {name: agent-inference, key: AGENT_MODEL_NAME, optional: true}}
        - name: AGENT_INFERENCE_REPLICA_ID
          valueFrom: {configMapKeyRef: {name: agent-inference, key: AGENT_INFERENCE_REPLICA_ID, optional: true}}
        - {name: AGENT_WORKSPACE_HOST_ROOT, value: __AGENT_BASE_DIR__}
        - {name: AGENT_WORKSPACE_CONTAINER_ROOT, value: /agent-workspaces}
        volumeMounts: [{name: workspace, mountPath: /workspace}, {name: agent-workspaces, mountPath: /agent-workspaces}, {name: inference, mountPath: /etc/agentic-inference, readOnly: true}]
      volumes: [{name: workspace, persistentVolumeClaim: {claimName: agentic-workspace}}, {name: agent-workspaces, hostPath: {path: __AGENT_BASE_DIR__, type: Directory}}, {name: inference, configMap: {name: agent-inference, items: [{key: AGENT_VLLM_URL, path: url}]}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: agentic-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      containers:
      - name: gateway
        image: agentic-worker:0.1
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command: [uvicorn, gateway:app, --host, 0.0.0.0, --port, "8000"]
        env:
        - {name: OTEL_SERVICE_NAME, value: agent-gateway}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        - {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://otel-collector:4318/v1/metrics"}
        - {name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: "http://otel-collector:4318/v1/logs"}
        - {name: AGENT_TELEMETRY_CONTENT_CAPTURE, value: full}
        - name: AGENT_API_KEYS
          valueFrom: {secretKeyRef: {name: agent-api-keys, key: json}}
        - {name: AGENT_WORKSPACE_HOST_ROOT, value: __AGENT_BASE_DIR__}
        - {name: AGENT_WORKSPACE_CONTAINER_ROOT, value: /agent-workspaces}
        ports: [{containerPort: 8000}]
        volumeMounts: [{name: agent-workspaces, mountPath: /agent-workspaces}]
      volumes: [{name: agent-workspaces, hostPath: {path: __AGENT_BASE_DIR__, type: Directory}}]
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: agentic-ai}
spec: {type: NodePort, selector: {app: api-gateway}, ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: task-reaper, namespace: agentic-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app: task-reaper}}
  template:
    metadata: {labels: {app: task-reaper}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      containers:
      - name: reaper
        image: agentic-worker:0.1
        imagePullPolicy: IfNotPresent
        command: [python, task_reaper.py]
        env:
        - {name: OTEL_SERVICE_NAME, value: task-reaper}
        - {name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: "http://otel-collector:4318/v1/traces"}
        - {name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://otel-collector:4318/v1/metrics"}
        - {name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: "http://otel-collector:4318/v1/logs"}
        - {name: AGENT_TELEMETRY_CONTENT_CAPTURE, value: full}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: agentic-ai}
data:
  config.yaml: |
    extensions:
      file_storage/queue: {directory: /var/lib/otelcol/queue}
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors: {batch: {}}
    exporters:
      otlp/phoenix:
        endpoint: ${env:OTEL_PHOENIX_ENDPOINT}
        tls: {insecure: true}
        sending_queue: {enabled: true, queue_size: 1000, storage: file_storage/queue}
        retry_on_failure: {enabled: true, max_elapsed_time: 300s}
      prometheusremotewrite:
        endpoint: ${env:OTEL_PROMETHEUS_ENDPOINT}
        sending_queue: {enabled: true, queue_size: 1000, storage: file_storage/queue}
        retry_on_failure: {enabled: true, max_elapsed_time: 300s}
      loki:
        endpoint: ${env:OTEL_LOGS_ENDPOINT}
        sending_queue: {enabled: true, queue_size: 1000, storage: file_storage/queue}
        retry_on_failure: {enabled: true, max_elapsed_time: 300s}
    service:
      extensions: [file_storage/queue]
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [otlp/phoenix]}
        metrics: {receivers: [otlp], processors: [batch], exporters: [prometheusremotewrite]}
        logs: {receivers: [otlp], processors: [batch], exporters: [loki]}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: agentic-ai}
spec:
  selector: {app: otel-collector}
  ports: [{name: otlp-http, port: 4318, targetPort: 4318}, {name: otlp-grpc, port: 4317, targetPort: 4317}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: otel-collector-queue, namespace: agentic-ai}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: loki-data, namespace: agentic-ai}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: loki-svc, namespace: agentic-ai}
spec: {selector: {app: loki}, ports: [{name: http, port: 3100, targetPort: 3100}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: agentic-ai}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      containers:
      - name: loki
        image: grafana/loki:3.3.2
        args: [-config.file=/etc/loki/local-config.yaml]
        ports: [{containerPort: 3100}]
        volumeMounts: [{name: data, mountPath: /tmp/loki}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: loki-data}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: agentic-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      nodeSelector: {agentic.io/role: agent}
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.120.0
        args: ["--config=/etc/otelcol-contrib/config.yaml"]
        env:
        - {name: OTEL_PHOENIX_ENDPOINT, valueFrom: {configMapKeyRef: {name: agent-inference, key: OTEL_PHOENIX_ENDPOINT}}}
        - {name: OTEL_PROMETHEUS_ENDPOINT, valueFrom: {configMapKeyRef: {name: agent-inference, key: OTEL_PROMETHEUS_ENDPOINT}}}
        - {name: OTEL_LOGS_ENDPOINT, valueFrom: {configMapKeyRef: {name: agent-inference, key: OTEL_LOGS_ENDPOINT}}}
        ports: [{containerPort: 4317}, {containerPort: 4318}]
        volumeMounts:
        - {name: config, mountPath: /etc/otelcol-contrib}
        - {name: queue, mountPath: /var/lib/otelcol/queue}
      volumes:
      - {name: config, configMap: {name: otel-collector-config}}
      - {name: queue, persistentVolumeClaim: {claimName: otel-collector-queue}}
